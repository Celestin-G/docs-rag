# Nginx reverse proxy for docs-rag
# Assumes the Go server runs on localhost:8080
#
# Deploy:
#   sudo cp nginx.conf /etc/nginx/sites-available/docs-rag
#   sudo ln -s /etc/nginx/sites-available/docs-rag /etc/nginx/sites-enabled/docs-rag
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limit zone: 10 MB shared memory (~160k IPs), 5 req/min per IP.
# Defined at the http{} level — include this file inside your http{} block,
# or paste directly into /etc/nginx/nginx.conf.
limit_req_zone $binary_remote_addr zone=rag_ask:10m rate=5r/m;

server {
    listen 80;
    server_name _;           # Replace with your domain, e.g. rag.formance.com

    # Forward real client IP to the Go app so its own rate limiter (and the
    # TRUSTED_PROXIES check behind it) sees the correct address.
    #
    # IMPORTANT: nginx does NOT merge server{}-level proxy_set_header
    # directives into a location{} that sets its own — the location's set
    # replaces the server's entirely. Every location below that needs its
    # own proxy_set_header (for SSE tuning, Connection '', etc.) therefore
    # repeats this full block. Do not add a location with its own
    # proxy_set_header without repeating Host/X-Real-IP/X-Forwarded-For/
    # X-Forwarded-Proto, or the Go app silently falls back to seeing every
    # request as 127.0.0.1 and all clients share one rate-limit bucket.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Web UI (no rate limit) -------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # --- LLM API (rate-limited + SSE-friendly) ----------------------------
    location /api/ask {
        # Allow burst of 3, then enforce the 5 req/min zone.
        # nodelay: excess requests are rejected immediately (no queue).
        limit_req zone=rag_ask burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;

        # SSE requires these — without them nginx buffers the stream and the
        # browser sees nothing until the response completes.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_http_version         1.1;
        chunked_transfer_encoding  on;

        # Repeated (see the comment at server{} scope above): this location
        # sets its own proxy_set_header for Connection '', which on its own
        # would make nginx drop Host/X-Real-IP/X-Forwarded-For for every
        # request handled here.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # LLM generation can take 60+ seconds — don't time out early.
        proxy_read_timeout 120s;
    }

    # --- MCP API (SSE-friendly; auth + its own rate limit enforced in Go) --
    location /api/mcp {
        proxy_pass http://127.0.0.1:8080;

        # The streamable HTTP transport holds a long-lived GET stream open
        # for server-to-client messages — same SSE requirements as
        # /api/ask, so nginx must not buffer or reuse a pooled keep-alive
        # connection that would stall it.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_http_version         1.1;
        chunked_transfer_encoding  on;

        # Repeated (see the comment at server{} scope above): this location
        # sets its own proxy_set_header for Connection '', which on its own
        # would make nginx drop Host/X-Real-IP/X-Forwarded-For for every
        # request handled here — including the MCP_TOKEN auth check and the
        # per-IP MCP rate limiter in the Go app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # MCP sessions can sit open waiting for the next tool call between
        # requests; keep this comfortably above the LLM generation time.
        proxy_read_timeout 600s;
    }
}
