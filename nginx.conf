# Nginx reverse proxy for docs-rag
# Assumes the Go server runs on localhost:8080
#
# Deploy:
#   sudo cp nginx.conf /etc/nginx/sites-available/docs-rag
#   sudo ln -s /etc/nginx/sites-available/docs-rag /etc/nginx/sites-enabled/docs-rag
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limit zone: 10 MB shared memory (~160k IPs), 5 req/min per IP.
# Defined at the http{} level — include this file inside your http{} block,
# or paste directly into /etc/nginx/nginx.conf.
limit_req_zone $binary_remote_addr zone=rag_ask:10m rate=5r/m;

server {
    listen 80;
    server_name _;           # Replace with your domain, e.g. rag.formance.com

    # Forward real client IP to the Go app so its own rate limiter sees the
    # correct address even when running behind this proxy.
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host            $host;

    # --- Web UI (no rate limit) -------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # --- LLM API (rate-limited + SSE-friendly) ----------------------------
    location /api/ask {
        # Allow burst of 3, then enforce the 5 req/min zone.
        # nodelay: excess requests are rejected immediately (no queue).
        limit_req zone=rag_ask burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;

        # SSE requires these — without them nginx buffers the stream and the
        # browser sees nothing until the response completes.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_set_header           Connection '';
        proxy_http_version         1.1;
        chunked_transfer_encoding  on;

        # LLM generation can take 60+ seconds — don't time out early.
        proxy_read_timeout 120s;
    }
}
